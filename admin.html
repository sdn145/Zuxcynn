<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Zuxcyn Store</title>

<style>
body{
  margin:0;
  background:#08090d;
  color:white;
  font-family:Arial,sans-serif;
  padding:25px;
}
.box{
  max-width:450px;
  margin:40px auto;
  background:#12141b;
  border:1px solid #303441;
  border-radius:20px;
  padding:25px;
}
h1{margin-top:0}
input{
  width:100%;
  padding:14px;
  box-sizing:border-box;
  border-radius:10px;
  border:1px solid #444;
  background:#08090d;
  color:white;
  margin:10px 0;
}
button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:white;
  color:#08090d;
  font-weight:bold;
  cursor:pointer;
}
#result{
  margin-top:15px;
  padding:15px;
  border-radius:10px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="box">
  <h1>🔐 Admin Zuxcyn</h1>

  <p>Masukkan kode pesanan pembeli:</p>

  <input
    id="orderCode"
    placeholder="Contoh: ZUX-ABC123"
    autocomplete="off"
  >

  <button onclick="confirmOrder()">
    ✅ Konfirmasi Pesanan
  </button>

  <div id="result"></div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyDPCsj9d_k8JESG18yZp9VC6Nw3YPtJKo4",
  authDomain: "zuxcyn-store.firebaseapp.com",
  projectId: "zuxcyn-store",
  storageBucket: "zuxcyn-store.firebasestorage.app",
  messagingSenderId: "132695006669",
  appId: "1:132695006669:web:443f37b12bd01ad3323884",
  measurementId: "G-Z5PJQ24K9W"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


const links = {
  full:
  "https://alightcreative.com/am/share/u/HOOqSCWvegQQAJaKpPpOutWquMu1/p/XlCvUW5ze8-a614ba8f95b94bfe",

  badaa:
  "https://alightcreative.com/am/share/u/ORedvT0kuPbIaRkh2ZQQef2oAju2/p/oSdMFDryih-5038213ac6c8f450"
};


window.confirmOrder = async function(){

  const code =
    document.getElementById("orderCode")
    .value
    .trim()
    .toUpperCase();

  const result =
    document.getElementById("result");

  if(!code){
    result.innerHTML =
      "⚠️ Masukkan kode pesanan terlebih dahulu.";
    return;
  }

  /*
    Untuk sementara pilih produk FULL EDIT.
    Nanti index.html akan menyimpan produk yang dibeli.
  */

  try{

    await setDoc(
      doc(db,"orders",code),
      {
        approved:true,
        link:links.full,
        confirmedAt:new Date().toISOString()
      },
      {merge:true}
    );

    result.innerHTML = `
      <b>✅ PESANAN DIKONFIRMASI</b><br><br>
      Kode: <b>${code}</b><br>
      Pembeli sekarang bisa mengecek aksesnya di website.
    `;

  }catch(error){

    console.error(error);

    result.innerHTML = `
      ❌ Gagal mengonfirmasi.<br><br>
      ${error.message}
    `;
  }

};

</script>

</body>
</html>
