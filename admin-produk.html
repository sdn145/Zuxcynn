<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Produk - Zuxcyn Store</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#08090d;
  color:#fff;
  font-family:Arial,sans-serif;
}

.container{
  max-width:760px;
  margin:auto;
  padding:24px 16px 60px;
}

.card{
  background:#11141b;
  border:1px solid #292d38;
  border-radius:20px;
  padding:22px;
  margin-bottom:20px;
}

h1{
  margin:0 0 8px;
  font-size:30px;
}

h2{
  margin-top:0;
}

.muted{
  color:#9ca3af;
  line-height:1.6;
  margin-bottom:20px;
}

label{
  display:block;
  margin:16px 0 7px;
  color:#c0c5ce;
}

input,
textarea{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #303541;
  background:#08090d;
  color:#fff;
  font-size:15px;
  outline:none;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input:focus,
textarea:focus{
  border-color:#6d7cff;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  margin-top:18px;
  background:#fff;
  color:#08090d;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:wait;
}

.status{
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  background:#0b0d12;
  color:#b8bec8;
  line-height:1.5;
  word-break:break-word;
}

.product{
  border-top:1px solid #292d38;
  padding:16px 0;
}

.product:first-child{
  border-top:0;
}

.name{
  font-weight:bold;
  font-size:18px;
}

.price{
  margin-top:5px;
  color:#9db8ff;
}

.desc{
  margin-top:7px;
  color:#9ca3af;
  line-height:1.5;
}

.links{
  margin-top:9px;
}

.links a{
  color:#9db8ff;
  word-break:break-all;
}

.small{
  font-size:12px;
  color:#777f8b;
  margin-top:7px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🛠️ Admin Produk</h1>

<div class="muted">
Tambah produk tanpa upload file foto.
Cukup masukkan URL gambar.

<br><br>

Firebase:
<b>zuxcyn-store-d26f6</b>

<br>

Collection:
<b>products</b>
</div>


<label>Nama Produk</label>

<input
  id="name"
  placeholder="Contoh: FULL EDIT"
>


<label>Harga</label>

<input
  id="price"
  type="number"
  min="0"
  placeholder="5000"
>


<label>Deskripsi</label>

<textarea
  id="description"
  placeholder="Deskripsi produk..."
></textarea>


<label>Link Alight Motion</label>

<input
  id="alightUrl"
  type="url"
  placeholder="https://alightcreative.com/..."
>


<label>URL Foto Produk</label>

<input
  id="image"
  type="url"
  placeholder="https://contoh.com/foto.jpg"
>

<div class="small">
Tidak menggunakan Firebase Storage.
Gunakan URL gambar publik.
</div>


<button id="add">
➕ Tambah Produk
</button>


<div id="status" class="status">
Menghubungkan ke Firebase...
</div>

</div>


<div class="card">

<h2>
📦 Produk Saat Ini
</h2>

<div id="products">

<div class="status">
Memuat...
</div>

</div>

</div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyCLKvbfsNBCK-GNy_38lMLtSxr4qJgYprc",

  authDomain:
  "zuxcyn-store-d26f6.firebaseapp.com",

  projectId:
  "zuxcyn-store-d26f6",

  storageBucket:
  "zuxcyn-store-d26f6.firebasestorage.app",

  messagingSenderId:
  "1068040066027",

  appId:
  "1:1068040066027:web:72f4e992ff5cf29819bfae",

  measurementId:
  "G-J109C49YC5"

};


const app =
initializeApp(
  firebaseConfig
);


const db =
getFirestore(
  app
);


/*
  COLLECTION YANG DIPAKAI
*/

const products =
collection(
  db,
  "products"
);


/* =====================================================
   HELPER
===================================================== */

const $ =
id =>
document.getElementById(id);


function status(message){

  $("status").textContent =
  message;

}


/* =====================================================
   LOAD PRODUK
===================================================== */

async function loadProducts(){

  const box =
  $("products");


  box.innerHTML =
  '<div class="status">Memuat produk...</div>';


  try{

    const snapshot =
    await getDocs(
      products
    );


    box.innerHTML =
    "";


    if(
      snapshot.empty
    ){

      box.innerHTML =
      '<div class="status">Belum ada produk.</div>';

      return;

    }


    snapshot.forEach(
      docSnap => {

        const p =
        docSnap.data();


        const item =
        document.createElement(
          "div"
        );


        item.className =
        "product";


        const name =
        document.createElement(
          "div"
        );

        name.className =
        "name";

        name.textContent =
        p.name ||
        "(tanpa nama)";


        const price =
        document.createElement(
          "div"
        );

        price.className =
        "price";

        price.textContent =
        "Rp " +
        Number(
          p.price || 0
        ).toLocaleString(
          "id-ID"
        );


        const desc =
        document.createElement(
          "div"
        );

        desc.className =
        "desc";

        desc.textContent =
        p.description ||
        "";


        const links =
        document.createElement(
          "div"
        );

        links.className =
        "links";


        if(
          p.alightUrl
        ){

          const a =
          document.createElement(
            "a"
          );


          a.href =
          p.alightUrl;

          a.target =
          "_blank";

          a.rel =
          "noopener noreferrer";

          a.textContent =
          "🔗 Link Alight Motion";


          links.appendChild(
            a
          );

        }


        if(
          p.image
        ){

          if(
            links.childNodes.length
          ){

            links.append(
              " • "
            );

          }


          const a =
          document.createElement(
            "a"
          );


          a.href =
          p.image;

          a.target =
          "_blank";

          a.rel =
          "noopener noreferrer";

          a.textContent =
          "🖼️ Foto Produk";


          links.appendChild(
            a
          );

        }


        item.append(
          name,
          price,
          desc,
          links
        );


        box.appendChild(
          item
        );

      }
    );


  }catch(error){

    console.error(
      error
    );


    box.innerHTML =
    "";


    const errorBox =
    document.createElement(
      "div"
    );


    errorBox.className =
    "status";


    errorBox.textContent =
    "❌ Gagal membaca products: " +
    (
      error.message ||
      error
    );


    box.appendChild(
      errorBox
    );

  }

}


/* =====================================================
   TAMBAH PRODUK
===================================================== */

$("add").onclick =
async function(){

  const name =
  $("name")
  .value
  .trim();


  const priceText =
  $("price")
  .value
  .trim();


  const description =
  $("description")
  .value
  .trim();


  const alightUrl =
  $("alightUrl")
  .value
  .trim();


  const image =
  $("image")
  .value
  .trim();


  if(
    !name ||
    !priceText ||
    !description ||
    !alightUrl ||
    !image
  ){

    status(
      "⚠️ Semua kolom wajib diisi."
    );

    return;

  }


  const price =
  Number(
    priceText
  );


  if(
    !Number.isFinite(price) ||
    price < 0
  ){

    status(
      "⚠️ Harga tidak valid."
    );

    return;

  }


  if(
    !/^https?:\/\//i.test(
      alightUrl
    )
  ){

    status(
      "⚠️ Link Alight Motion harus diawali https:// atau http://"
    );

    return;

  }


  if(
    !/^https?:\/\//i.test(
      image
    )
  ){

    status(
      "⚠️ URL foto harus diawali https:// atau http://"
    );

    return;

  }


  const button =
  $("add");


  button.disabled =
  true;


  button.textContent =
  "Menyimpan...";


  status(
    "⏳ Menyimpan produk..."
  );


  try{

    await addDoc(

      products,

      {

        name:
        name,

        price:
        price,

        description:
        description,

        alightUrl:
        alightUrl,

        image:
        image,

        createdAt:
        serverTimestamp()

      }

    );


    $("name").value =
    "";

    $("price").value =
    "";

    $("description").value =
    "";

    $("alightUrl").value =
    "";

    $("image").value =
    "";


    status(
      "✅ Produk berhasil ditambahkan."
    );


    await loadProducts();


  }catch(error){

    console.error(
      error
    );


    status(
      "❌ Gagal: " +
      (
        error.message ||
        error
      )
    );


  }finally{

    button.disabled =
    false;


    button.textContent =
    "➕ Tambah Produk";

  }

};


/* =====================================================
   START
===================================================== */

status(
  "✅ Firebase siap."
);


loadProducts();

</script>

</body>
</html>
