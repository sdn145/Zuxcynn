<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kelola Produk - Zuxcyn</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#fff;font-family:Arial,sans-serif}
.box{max-width:620px;margin:30px auto;padding:22px}.panel{background:#11141b;border:1px solid #292d38;border-radius:18px;padding:20px;margin-bottom:18px}
h1{margin:0 0 8px}.muted{color:#999;font-size:13px;line-height:1.5}
label{display:block;margin-top:14px;font-size:12px;color:#aaa}
input,textarea{width:100%;margin-top:7px;padding:13px;border-radius:10px;border:1px solid #303440;background:#08090d;color:#fff;outline:none}
textarea{min-height:100px;resize:vertical}button{width:100%;margin-top:15px;padding:13px;border:0;border-radius:10px;background:#fff;color:#08090d;font-weight:bold;cursor:pointer}
.danger{background:#35161a;color:#fff}.item{border:1px solid #292d38;border-radius:12px;padding:14px;margin-top:12px}.item img{width:70px;height:70px;object-fit:cover;border-radius:9px;float:left;margin-right:12px}.clear{clear:both}.status{margin-top:12px;font-size:13px}
</style>
</head>
<body>
<div class="box">
<div class="panel">
<h1>🛠️ Kelola Produk</h1>
<div class="muted">Tambah produk baru. Produk akan tampil otomatis di website pembeli setelah tersimpan.</div>

<label>Nama produk</label>
<input id="name" placeholder="Contoh: +7 Badas transition">

<label>Harga (angka saja)</label>
<input id="price" type="number" min="0" placeholder="2000">

<label>Deskripsi</label>
<textarea id="description" placeholder="Deskripsi produk..."></textarea>

<label>Link Alight Motion</label>
<input id="link" type="url" placeholder="https://alightcreative.com/...">

<label>Foto produk</label>
<input id="photo" type="file" accept="image/*">

<button id="save">➕ Tambah Produk</button>
<div id="status" class="status"></div>
</div>

<div class="panel">
<h2>📦 Produk Saat Ini</h2>
<div id="products"><div class="muted">Memuat...</div></div>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {getFirestore,collection,addDoc,getDocs,deleteDoc,doc,query,orderBy} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL,deleteObject} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js";

const firebaseConfig={
apiKey:"AIzaSyDPCsj9d_k8JESG18yZp9VC6Nw3YPtJKo4",
authDomain:"zuxcyn-store.firebaseapp.com",
projectId:"zuxcyn-store",
storageBucket:"zuxcyn-store.firebasestorage.app",
messagingSenderId:"132695006669",
appId:"1:132695006669:web:443f37b12bd01ad3323884",
measurementId:"G-Z5PJQ24K9W"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const storage=getStorage(app);

const $=id=>document.getElementById(id);
const slugify=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

$("save").onclick=async()=>{
const name=$("name").value.trim(),price=Number($("price").value),description=$("description").value.trim(),link=$("link").value.trim(),file=$("photo").files[0];
if(!name||!Number.isFinite(price)||price<0||!description||!link||!file){$("status").textContent="⚠️ Lengkapi semua data.";return}
if(!/^https?:\/\//i.test(link)){$("status").textContent="⚠️ Link harus diawali https:// atau http://";return}
$("save").disabled=true;$("status").textContent="⏳ Menyimpan...";
try{
const productRef=await addDoc(collection(db,"products"),{name,price,description,link,createdAt:new Date().toISOString(),active:true});
const safe=slugify(name)||"product";
const storageRef=ref(storage,`products/${productRef.id}-${safe}`);
await uploadBytes(storageRef,file,{contentType:file.type});
const photoURL=await getDownloadURL(storageRef);
const {updateDoc}=await import("https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js");
await updateDoc(doc(db,"products",productRef.id),{photoURL,storagePath:storageRef.fullPath});
$("name").value="";$("price").value="";$("description").value="";$("link").value="";$("photo").value="";
$("status").textContent="✅ Produk berhasil ditambahkan.";
await loadProducts();
}catch(e){console.error(e);$("status").textContent="❌ Gagal: "+e.message}
finally{$("save").disabled=false}
};

async function loadProducts(){
const wrap=$("products");wrap.innerHTML="";
try{
const snap=await getDocs(query(collection(db,"products"),orderBy("createdAt","desc")));
if(snap.empty){wrap.innerHTML='<div class="muted">Belum ada produk.</div>';return}
snap.forEach(s=>{
const p=s.data(),item=document.createElement("div");item.className="item";
item.innerHTML=`<img src="${p.photoURL||""}" alt=""><b>${escapeHTML(p.name||"Produk")}</b><br><span class="muted">Rp${Number(p.price||0).toLocaleString("id-ID")}</span><div class="clear"></div><button class="danger">🗑️ Hapus</button>`;
item.querySelector("button").onclick=()=>removeProduct(s.id,p.storagePath);
wrap.appendChild(item);
});
}catch(e){wrap.innerHTML='<div class="muted">❌ '+escapeHTML(e.message)+'</div>'}
}
async function removeProduct(id,path){
if(!confirm("Hapus produk ini?"))return;
try{await deleteDoc(doc(db,"products",id));if(path){try{await deleteObject(ref(storage,path))}catch(e){} }await loadProducts()}catch(e){alert("Gagal menghapus: "+e.message)}
}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
loadProducts();
</script>
</body>
</html>
